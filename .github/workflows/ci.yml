name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci

      - name: Fetch osquery (pinned version and SHA-256)
        run: npm run fetch-osquery

      - name: Format
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (release and Test builds)
        working-directory: src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features test-build -- -D warnings

      - name: Unit and relay tests (release and Test builds)
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo test --locked --features test-build

      - name: Run every check against the real osquery, as this runner's user
        working-directory: src-tauri
        run: cargo test --locked --test live_osquery -- --ignored --nocapture --test-threads=1
