name: Release builds

# Builds WTF Helper and WTF Helper Test for macOS and Windows.
# Signs and notarizes only when the signing secrets exist; otherwise the builds are
# unsigned and meant for named testers only (see TESTING.md).
# Builds are workflow artifacts. A `v*` tag also makes a DRAFT release, which only
# people with access to this repo can see. There is no public download link.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.flavor == 'test' && 'WTF Helper Test' || 'WTF Helper' }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, os: macos-latest, flavor: release }
          - { platform: macos, os: macos-latest, flavor: test }
          - { platform: windows, os: windows-latest, flavor: release }
          - { platform: windows, os: windows-latest, flavor: test }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      FLAVOR_ARGS: ${{ matrix.flavor == 'test' && '--features test-build --config src-tauri/tauri.test.conf.json' || '' }}
      ARTIFACT_NAME: ${{ matrix.flavor == 'test' && 'WTF-Helper-Test' || 'WTF-Helper' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install the Tauri CLI
        run: npm ci

      - name: Fetch osquery (pinned version and SHA-256)
        run: npm run fetch-osquery

      - name: Which signing secrets exist
        id: signing
        env:
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then signed="$HAS_APPLE"; else signed="$HAS_AZURE"; fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          if [ "$signed" = true ]; then echo "Signing secrets found: this build will be signed."; else echo "::notice::No signing secrets: unsigned build for named testers only."; fi

      - name: Install the Azure Artifact Signing tool
        if: matrix.platform == 'windows' && steps.signing.outputs.signed == 'true'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Build (macOS universal)
        if: matrix.platform == 'macos'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          S_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          S_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ "$SIGNED" = true ]; then
            export APPLE_CERTIFICATE="$S_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$S_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$S_APPLE_SIGNING_IDENTITY"
            export APPLE_API_ISSUER="$S_APPLE_API_ISSUER"
            export APPLE_API_KEY="$S_APPLE_API_KEY"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$S_APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          npx tauri build --target universal-apple-darwin --bundles app,dmg $FLAVOR_ARGS
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build (Windows x64)
        if: matrix.platform == 'windows'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          SIGN_ARGS=""
          if [ "$SIGNED" = true ]; then
            node -e '
              const cmd = `artifact-signing-cli -e ${process.env.AZURE_SIGNING_ENDPOINT} -a ${process.env.AZURE_SIGNING_ACCOUNT} -c ${process.env.AZURE_SIGNING_PROFILE} -d "WTF Helper" %1`;
              require("fs").writeFileSync(process.env.RUNNER_TEMP + "/signing.json", JSON.stringify({ bundle: { windows: { signCommand: cmd } } }));
            '
            SIGN_ARGS="--config $RUNNER_TEMP/signing.json"
          fi
          npx tauri build --bundles nsis $FLAVOR_ARGS $SIGN_ARGS

      - name: Collect the installer and its checksum
        run: |
          mkdir -p out
          if [ "${{ matrix.platform }}" = macos ]; then
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/
          else
            cp src-tauri/target/release/bundle/nsis/*.exe out/
          fi
          suffix=${{ steps.signing.outputs.signed == 'true' && 'signed' || 'UNSIGNED' }}
          for f in out/*; do
            base=$(basename "$f"); ext="${base##*.}"
            mv "$f" "out/${ARTIFACT_NAME}-${{ github.ref_name }}-${{ matrix.platform }}-${suffix}.${ext}"
          done
          cd out && (sha256sum * 2>/dev/null || shasum -a 256 *) > "SHA256SUMS-${ARTIFACT_NAME}-${{ matrix.platform }}.txt" && cat SHA256SUMS-*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.platform }}-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: out/*
          retention-days: 14
          if-no-files-found: error

  draft-release:
    name: Draft release (not public)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "WTF Helper $TAG" \
            --notes "Draft. Not for public download. Files marked UNSIGNED are for named testers only; see TESTING.md."
